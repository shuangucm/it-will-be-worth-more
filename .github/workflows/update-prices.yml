name: Update ETF prices

on:
  schedule:
    # Weekdays ~30 min after the US market close (22:30 UTC covers both EST and EDT).
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Overlapping runs would race each other's pushes; run them one at a time.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/update_prices.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/prices.json && git ls-files --error-unmatch docs/data/prices.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          git commit -m "Update ETF prices $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
